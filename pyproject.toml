[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tracesage"
version = "1.0.0"
description = "Local-first observability for LLM agents: LangChain/LangGraph, Pydantic AI, OpenAI Agents SDK, CrewAI and any OpenTelemetry source"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "tracesage contributors" },
]
keywords = ["langchain", "langgraph", "pydantic-ai", "openai-agents", "crewai", "opentelemetry", "otlp", "observability", "tracing", "agents", "llm", "multi-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
]

# Floors are the oldest releases that pass the test suite and have no known CVEs.
# CI installs them (`--resolution lowest-direct`) and pip-audits the result.
# starlette, langsmith, langgraph-sdk and protobuf are transitive but listed so their floors
# exclude vulnerable releases that the parent package would otherwise allow.
dependencies = [
    "fastapi>=0.133.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.16.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/kjgpta/tracesage"
Repository = "https://github.com/kjgpta/tracesage"
Documentation = "https://kjgpta.github.io/tracesage/"
Changelog = "https://github.com/kjgpta/tracesage/blob/main/docs/changelog.md"
Issues = "https://github.com/kjgpta/tracesage/issues"

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.3.3,<2.0.0",
    "langsmith>=0.8.18",
]
# MCP tool-source attribution + the examples/mcp scenario. Optional: the
# core package and `import tracesage` never require these (imported lazily).
mcp = [
    "langchain-mcp-adapters>=0.3.0",
    "mcp>=1.30.0,<2",
    "langgraph>=1.0.10",
    "langgraph-sdk>=0.4.6",
]
# OpenTelemetry, both directions. Export: OTLP/HTTP span export when
# `otlp_endpoint` is configured. Ingest: the in-process bridge
# (`tracesage.instrument(...)` / `install_otel()`) and protobuf decoding on
# `POST /v1/traces` (OTLP/JSON ingest works without this extra). Everything is
# imported lazily — `import tracesage` never requires these.
otel = [
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-proto>=1.45.2",
    "protobuf>=5.29.6",
]
# Framework bridges: each pulls the OTel SDK plus the instrumentor that turns
# that framework's calls into spans tracesage understands. The framework itself
# (pydantic-ai, openai-agents, crewai, openai, anthropic) is NOT pinned here —
# install whichever version your app already uses.
pydantic-ai = [
    "opentelemetry-sdk>=1.45.2",
]
openai-agents = [
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-genai-openai-agents>=1.3b0",
    "opentelemetry-instrumentation-genai-openai>=1.3b0",
]
openai = [
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-genai-openai>=1.3b0",
]
anthropic = [
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-genai-anthropic>=1.3b0",
]
crewai = [
    "opentelemetry-sdk>=1.45.2",
    "openinference-instrumentation-crewai>=1.1.29",
]
# Dollar cost for LLM calls. Offline price snapshot; the base install leaves
# cost as "n/a" when this extra is missing.
pricing = [
    "genai-prices>=0.2.5",
]
# One-command app integration: MCP server, config editing, and dollar cost.
# The existing [mcp] extra stays the LangChain MCP-adapter extra.
apps = [
    "genai-prices>=0.2.5",
    "mcp>=1.30.0,<2",
    "tomlkit>=0.13.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.17.6",
    "mypy>=1.10.0",
    "build>=1.6.1",
    "twine>=7.0.0",
    "pip-audit>=2.7.0",
    "langchain>=1.3.9",
    "langgraph>=1.0.10",
    "langgraph-sdk>=0.4.6",
    "langchain-core>=1.3.3,<2.0.0",
    "langsmith>=0.8.18",
    "langchain-mcp-adapters>=0.3.0",
    "mcp>=1.30.0,<2",
    "genai-prices>=0.2.5",
    "tomlkit>=0.13.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-proto>=1.45.2",
    "protobuf>=5.29.6",
    "pydantic-ai-slim>=2.71.0",
]

[project.scripts]
tracesage = "tracesage.cli:app"

# Expose the trace-capture fixture (`tracesage_capture`) to users' pytest suites.
[project.entry-points.pytest11]
tracesage = "tracesage.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/tracesage"]

# The Desktop extension source has to travel inside the wheel. `connect --mcpb`
# packs it from here; a source checkout also keeps the copy under tools/mcpb.
[tool.hatch.build.targets.wheel.force-include]
"tools/mcpb/manifest.json" = "tracesage/_mcpb/manifest.json"
"tools/mcpb/pyproject.toml" = "tracesage/_mcpb/pyproject.toml"
"tools/mcpb/.mcpbignore" = "tracesage/_mcpb/.mcpbignore"
"tools/mcpb/src/server.py" = "tracesage/_mcpb/src/server.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/tracesage",
    "tests",
    "examples",
    "/README.md",
    "LICENSE",
    "docs",
    "pyproject.toml",
    "tools/mcpb",
]
# Keep heavy UI screenshots / demo video out of the PyPI sdist — they exist only
# for the GitHub repo + the (separately built) docs site, not for source installs.
exclude = [
    "docs/assets/ui-*.png",
    "docs/assets/*.mp4",
    "docs/assets/*.gif",
    "tools/mcpb/*.mcpb",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests using real LangChain components",
    "slow: long-running tests (excluded from default CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "PT", "SIM", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "ASYNC230", "ASYNC109", "ASYNC240", "E741", "F401", "SIM105", "UP017", "UP041"]
"src/tracesage/cli.py" = ["B008", "UP007"]  # Typer requires call expressions in defaults
"src/tracesage/storage/sqlite_backend.py" = ["UP017"]  # project convention: timezone.utc, not datetime.UTC
"src/tracesage/models.py" = ["UP042"]  # str-Enum inheritance is intentional for JSON serialization
"tools/**/*.py" = ["S108", "S311", "SIM105"]  # dev tooling: /tmp scratch, random, try/except
"src/tracesage/service.py" = ["S603", "S607"]  # fixed launchctl / systemctl / schtasks argv

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.coverage.run]
source = ["src/tracesage"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
